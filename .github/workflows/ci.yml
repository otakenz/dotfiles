name: "CI"

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "main"
      - "master"
  schedule:
    - cron: "30 12 * * *"

jobs:
  test:
    name: "Test Linting and Testing"
    runs-on: "ubuntu-24.04"

    steps:
      - uses: "actions/checkout@v4"

      - name: "Linting and testing"
        run: |
          ./run ci:test

  keys:
    name: "Keys phase (${{ matrix.name }})"
    runs-on: "${{ matrix.runner }}"
    container: "${{ matrix.image }}"
    timeout-minutes: 10
    # Ubuntu 26.04 ships libgcrypt 1.12.0, which randomly rejects imported
    # cv25519 keys (https://bugs.launchpad.net/bugs/2174038). Drop this once
    # libgcrypt20 >= 1.12.1 reaches the 26.04 archive.
    continue-on-error: "${{ matrix.known_issue == true }}"
    env:
      GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ubuntu-24.04"
            runner: "ubuntu-24.04"
            image: "ubuntu:24.04"
          - name: "ubuntu-26.04"
            runner: "ubuntu-24.04"
            image: "ubuntu:26.04"
            known_issue: true
          - name: "archlinux"
            runner: "ubuntu-24.04"
            image: "archlinux:latest"
          - name: "macos"
            runner: "macos-latest"
            image: ""

    steps:
      - uses: "actions/checkout@v4"

      - name: "Install test dependencies"
        run: |
          bash test/deps.sh

      - name: "Test ./install --keys"
        run: |
          bash test/keys.sh

      - name: "Test ./install --only"
        run: |
          bash test/install-only.sh

      - name: "Test public-leak check"
        run: |
          bash test/public-leak-test.sh

      - name: "Test opencode-cli-sync"
        run: |
          bash test/opencode-cli-sync.sh
